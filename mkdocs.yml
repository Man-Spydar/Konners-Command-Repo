use_directory_urls: false

site_name: Service Desk Command Repository
site_description: Konner’s Full Code Repository

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    scheme: slate
    primary: "#ECEFF4"
    accent: "#C94A4A"
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - File Commands: File_Commands.md
  - Registry Edits: Registry.md
  - Software Installers: Software Installers.md
  - Anaconda & Python: Python-Anaconda.md
  - Azure: Azure.md
  - PS-Exec Helper: PSEXEC.md
  - RoboCopy Helper: Robocopy.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight
