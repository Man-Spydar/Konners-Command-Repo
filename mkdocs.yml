use_directory_urls: false

site_name: KFC Repository
site_description: Konner’s Full Code Repository

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    scheme: slate
    primary: black
    accent: red
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - Files & Permissions:
      - Overview: files/index.md
      - Unblocking & Zone-ID: files/unblocking.md
      - Permissions & Ownership (WIP): files/permissions.md
      - Digital Signatures: files/signatures.md
      - Robocopy Helper: files/robocopy.md

  - Process & Execution:
      - Overview: execution/index.md
      - PsExec: execution/psexec.md
      - RunAs / Elevation (WIP): execution/elevation.md

  - Software & Packages:
      - Overview: software/index.md
      - Appx / AppxPackage: software/appx.md
      - MSI & EXE Installs: software/installers.md
      - Office / Click-to-Run (WIP): software/office.md

  - Python & Automation:
      - Overview: python/index.md
      - Conda Environments: python/conda.md
      - pip Usage: python/pip.md


  - Azure & Cloud Admin:
      - Overview: cloud/index.md
      - Admin PowerShell: cloud/powershell.md
  - Networking:
      - Overview: networking/index.md
      - DNS & IP Tools: networking/dns.md
      - Connectivity Tests (WIP): networking/connectivity.md

  - Windows Internals:
      - Overview: windows/index.md
      - Registry: windows/registry.md
      - Services & Tasks (WIP): windows/services.md

  - Reference:
      - Overview: reference/index.md
      - Exit Codes & Flags (WIP): reference/flags.md
      - Common Paths: reference/paths.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight

extra_css:
  - stylesheets/extra.css
